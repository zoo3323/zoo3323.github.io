<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -4 80 80" width="32" height="32">
  <!-- 쥔 손(grabbing): 편 손과 같은 선에 손가락을 접은 주먹. 잡고 있는 동안은 사이트의 누름 색(레몬)으로 칠한다.
       접은 손가락 사이에 짧은 선을 긋는다. 누르는 자리(hotspot)는 편 손과 같은 16,16(32px 기준). -->
  <defs>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#17171a" flood-opacity=".3"/>
    </filter>
    <g id="fingers" fill="none" stroke-linecap="round">
      <path d="M21.4 30v4"/>
      <path d="M29.3 28.5v5"/>
      <path d="M37.2 28.5v5"/>
      <path d="M45.1 30v4"/>
      <path d="M22.5 46 15.5 39.5"/>
    </g>
    <path id="body" d="M27.5 30H37.5A10 10 0 0 1 47.5 40V44C47.5 48 45 50.5 43.5 52V54.5A3.5 3.5 0 0 1 40 58H25A3.5 3.5 0 0 1 21.5 54.5V52C20 50.5 17.5 48 17.5 44V40A10 10 0 0 1 27.5 30Z"/>
  </defs>
  <g filter="url(#s)">
    <use href="#fingers" stroke="#17171a" stroke-width="14"/>
    <use href="#body" fill="#17171a" stroke="#17171a" stroke-width="6.8" stroke-linejoin="round"/>
    <use href="#fingers" stroke="#ffe55c" stroke-width="7.2"/>
    <use href="#body" fill="#ffe55c"/>
    <path d="M25.35 28.6v6.9M33.25 27.6v7.4M41.15 28.6v6.9" stroke="#17171a" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
