<svg xmlns="http://www.w3.org/2000/svg" viewBox="-8 -4 80 80" width="32" height="32">
  <!-- 편 손(grab): 흰 종이 손에 진한 테두리. 손가락은 둥근 선이고, 테두리 층을 먼저 굵게 깔고 그 위에 종이 층을 얹는다.
       손가락 사이가 테두리 굵기보다 좁아 그 틈이 손가락 사이 선이 된다. 누르는 자리(hotspot)는 16,16(32px 기준). -->
  <defs>
    <filter id="s" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.6" stdDeviation="1.4" flood-color="#17171a" flood-opacity=".3"/>
    </filter>
    <g id="fingers" fill="none" stroke-linecap="round">
      <path d="M23.5 37 21 14.5"/>
      <path d="M30.5 36V10.5"/>
      <path d="M37.5 37 40 14"/>
      <path d="M43 40 47.5 21.5"/>
      <path d="M22 47 10.5 33.5"/>
    </g>
    <path id="body" d="M28.5 30H36.5A10 10 0 0 1 46.5 40V44C46.5 48 44 50.5 42.5 52V54.5A3.5 3.5 0 0 1 39 58H26A3.5 3.5 0 0 1 22.5 54.5V52C21 50.5 18.5 48 18.5 44V40A10 10 0 0 1 28.5 30Z"/>
  </defs>
  <g filter="url(#s)">
    <use href="#fingers" stroke="#17171a" stroke-width="13.8"/>
    <use href="#body" fill="#17171a" stroke="#17171a" stroke-width="6.8" stroke-linejoin="round"/>
    <use href="#fingers" stroke="#ffffff" stroke-width="7"/>
    <use href="#body" fill="#ffffff"/>
  </g>
</svg>
