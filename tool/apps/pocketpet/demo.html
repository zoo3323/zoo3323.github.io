<div class="demo demo--pet" data-pet-demo="/assets/img/pocketpet/">
  <div class="petbox">
    <div class="petbox__stage"><img data-pet-stage data-style="soft" src="/assets/img/pocketpet/stage/nyangi.webp" width="576" height="624" alt="터키시 앙고라 그림"></div>
    <div>
      <p class="petbox__name" data-pet-name aria-live="polite">터키시 앙고라</p>
      <p class="petbox__kind" data-pet-kind>고양이 · 큐티</p>
      <button type="button" class="btn petbox__go" data-pet-toggle aria-pressed="false"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 2.5v9l7.5-4.5z"/></svg> <span data-label>꺼내 보기</span></button>
      <p class="petbox__hint">이 화면 위로 나와 걸어 다닙니다. 끌어서 옮기고, 던지고, 눌러서 인사를 받아 보세요.</p>
    </div>
  </div>
  <fieldset class="roster">
    <legend>앱의 50마리 가운데 6마리</legend>
    <div class="roster__row" role="group" aria-label="동물 고르기">
      <button type="button" class="pick" data-pet="nyangi" data-breed="터키시 앙고라" data-kind="고양이 · 큐티" data-style="soft" data-stage="true" aria-pressed="true" aria-label="터키시 앙고라, 큐티"><img src="/assets/img/pocketpet/thumb/nyangi.webp" width="192" height="208" alt="" loading="lazy"></button>
      <button type="button" class="pick" data-pet="siamese" data-breed="샴" data-kind="고양이 · 도트" data-style="pixel" data-stage="false" aria-pressed="false" aria-label="샴, 도트"><img src="/assets/img/pocketpet/thumb/siamese.webp" width="192" height="208" alt="" loading="lazy"></button>
      <button type="button" class="pick" data-pet="jjong" data-breed="시바 이누(블랙탄)" data-kind="강아지 · 큐티" data-style="soft" data-stage="true" aria-pressed="false" aria-label="시바 이누(블랙탄), 큐티"><img src="/assets/img/pocketpet/thumb/jjong.webp" width="192" height="208" alt="" loading="lazy"></button>
      <button type="button" class="pick" data-pet="pomeranian" data-breed="포메라니안" data-kind="강아지 · 도트" data-style="pixel" data-stage="false" aria-pressed="false" aria-label="포메라니안, 도트"><img src="/assets/img/pocketpet/thumb/pomeranian.webp" width="192" height="208" alt="" loading="lazy"></button>
      <button type="button" class="pick" data-pet="winter-dwarf-soft" data-breed="윈터 화이트 드워프" data-kind="햄스터 · 큐티" data-style="soft" data-stage="true" aria-pressed="false" aria-label="윈터 화이트 드워프, 큐티"><img src="/assets/img/pocketpet/thumb/winter-dwarf-soft.webp" width="192" height="208" alt="" loading="lazy"></button>
      <button type="button" class="pick" data-pet="roborovski-pixel" data-breed="로보로브스키" data-kind="햄스터 · 도트" data-style="pixel" data-stage="false" aria-pressed="false" aria-label="로보로브스키, 도트"><img src="/assets/img/pocketpet/thumb/roborovski-pixel.webp" width="192" height="208" alt="" loading="lazy"></button>
    </div>
    <div class="roster__group" data-made-group hidden>
      <p class="roster__kind" id="kind-made">사진으로 만든 펫</p>
      <div class="roster__row" role="group" aria-labelledby="kind-made" data-made-row></div>
    </div>
  </fieldset>
  <div class="petmake" data-petmake>
    <p class="petmake__title"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 2.5v9M2.5 7h9"/></svg> 사진으로 새 펫 만들기 <span class="petmake__tag">유료 기능 미리 보기</span></p>
    <div class="petmake__photos" role="group" aria-label="반려동물 사진 고르기">
      <button type="button" class="petmake__photo" data-photo="cat" aria-pressed="false"><img src="/assets/img/pocketpet/make/pet-cat-s.webp" width="160" height="213" alt=""><span>고양이 사진</span></button>
      <button type="button" class="petmake__photo" data-photo="dog" aria-pressed="false"><img src="/assets/img/pocketpet/make/pet-dog-s.webp" width="160" height="213" alt=""><span>강아지 사진</span></button>
      <button type="button" class="petmake__photo" data-photo="hamster" aria-pressed="false"><img src="/assets/img/pocketpet/make/pet-hamster-s.webp" width="160" height="213" alt=""><span>햄스터 사진</span></button>
    </div>
    <button type="button" class="btn petmake__go" data-make disabled>이 사진으로 펫 만들기</button>
    <p class="petmake__note" data-make-note aria-live="polite">사진을 고르면 그 동물을 닮은 펫을 만들어 위 목록에 넣습니다.</p>
  </div>
</div>
<p class="sec__note">사진으로 펫 만들기는 추가할 예정인 유료 기능을 미리 보여 주는 시연입니다. 사진은 생성 이미지이고, 만들어지는 펫은 앱에 이미 있는 그림으로 대신 보여 줍니다.</p>
